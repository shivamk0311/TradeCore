services:
  postgres:
    image: postgres:17-alpine
    container_name: tradecore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradecore
      POSTGRES_USER: tradecore
      POSTGRES_PASSWORD: tradecore_dev_password
    ports:
      - "5433:5432"
    volumes:
      - tradecore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradecore -d tradecore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradecore_postgres_data: